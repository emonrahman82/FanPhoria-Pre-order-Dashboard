<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FanPhoria Pre-Order Management</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8f4f4;--card:#fff;--ink:#141012;--mut:#6e6366;--line:#eadddf;--acc:#bc1823;--acc2:#141012;--side:#0b0b0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b0c;--card:#171415;--ink:#f5eeee;--mut:#a89b9e;--line:#2e2527;--acc:#bc1823;--acc2:#f5eeee;--side:#050505}}
:root[data-theme="dark"]{--bg:#0d0b0c;--card:#171415;--ink:#f5eeee;--mut:#a89b9e;--line:#2e2527;--acc:#bc1823;--acc2:#f5eeee;--side:#050505}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Georgia,serif;letter-spacing:-.02em;margin:0}
h1{font-size:30px;font-weight:800;margin-bottom:18px}h2{font-size:18px;margin-bottom:10px}
aside{width:210px;background:var(--side);color:#f1eefb;padding:20px 12px;position:sticky;top:0;height:100vh;flex:none}
.brand{font-size:22px;font-weight:800;padding:0 10px 4px}.brand b{color:var(--acc)}
aside small{display:block;padding:0 10px 18px;color:#a09db8;font-size:12px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfcce6;padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button:hover{background:#ffffff14}nav button.on{background:var(--acc);color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--acc));border-radius:10px;padding:12px 14px}
.stat b{display:block;font:800 28px "Bricolage Grotesque",serif}.stat span{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--mut);font-weight:600}tbody tr[data-open],tbody tr[data-cu]{cursor:pointer}tbody tr:hover{background:#bc18230f}
.wrap{overflow-x:auto}.r{text-align:right}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
button.b,a.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px Figtree,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:none;color:var(--ink);border:1px solid var(--line)}button.d{background:#b42318}button:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:60px;resize:vertical}label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar>*{flex:1 1 150px;width:auto}
.prow{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card)}
.ph,.pic{width:96px;height:96px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden}
.pic img,.ph img,.th img{width:100%;height:100%;object-fit:cover}.th{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.total{display:flex;justify-content:space-between;align-items:center;font:800 22px "Bricolage Grotesque",serif;padding:14px 0}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:9}
.modal{background:var(--card);border-radius:14px;max-width:720px;width:100%;padding:22px}
.pl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.pl>div:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.pg .card{padding:10px;font-size:13.5px}.pg .big{height:150px;border-radius:8px;overflow:hidden;background:var(--bg);margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--mut)}.pg img{width:100%;height:100%;object-fit:cover}
.br{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}.br i{display:block;height:12px;border-radius:6px;background:var(--c,var(--acc))}
.att div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.att b{color:var(--acc)}
.mut{color:var(--mut)}.empty{text-align:center;padding:36px 12px;color:var(--mut)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;z-index:99;display:none}
.warn{background:#fdecc8;color:#5b3a00;padding:10px 14px;border-radius:9px;margin-bottom:16px}
@media(max-width:820px){body{display:block}aside{width:auto;height:auto;position:static;padding:12px}aside small{display:none}nav{display:flex;overflow-x:auto;gap:4px}nav button{width:auto;white-space:nowrap}main{padding:18px 14px 50px}.grid2{grid-template-columns:1fr}.br{grid-template-columns:100px 1fr 74px}}
.tg{display:block;width:100%;margin-top:14px;background:#ffffff14;color:#f1eefb;border:1px solid #ffffff26;border-radius:8px;padding:9px 10px;font:600 13.5px Figtree,sans-serif;cursor:pointer;text-align:left}.tg:hover{background:#ffffff26}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
*{transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .3s ease,transform .25s ease}
.stat:hover,.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #bc182324}button.b:hover{filter:brightness(1.15)}
#login{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 10%,#bc182345,transparent 55%),#0b0b0c;padding:16px}body.locked #login{display:flex}body.locked aside,body.locked main,body.locked #modal{display:none}
.lc{background:#141011;color:#f5eeee;border:1px solid #2e2527;border-radius:16px;padding:28px;width:100%;max-width:360px;animation:rise .5s ease}.lc input{background:#0b0b0c;color:#f5eeee;border-color:#2e2527}.lc label{color:#a89b9e}.lc .brand{font-size:30px;padding:0}.lc p{color:#a89b9e;margin:2px 0 16px}#le{color:#ff7b84;min-height:20px;margin-top:8px;font-size:13px}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media(max-width:820px){.tg{width:auto;margin:8px 0 0}}
@media print{aside,main,#toast,.noprint{display:none!important}body{display:block;background:#fff}.ov{position:static;background:none;padding:0;display:block;overflow:visible}.modal{background:#fff;max-width:none!important;padding:0;border-radius:0}}
/* ===== Refined look: calm, airy, minimal ===== */
:root{--side:#fff;--sideInk:#141012;--sideMut:#8a7f82;--sideHov:#bc182310;--r:18px;--sh:0 1px 2px #1410120a,0 10px 28px -14px #14101238}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sideInk:#f5eeee;--sideMut:#8d8184;--sideHov:#ffffff10;--sh:0 10px 28px -14px #000}}
:root[data-theme="dark"]{--sideInk:#f5eeee;--sideMut:#8d8184;--sideHov:#ffffff10;--sh:0 10px 28px -14px #000}
body{font-size:15px;-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:700;margin-bottom:22px}h2{font-size:17px;font-weight:700;margin-bottom:14px}
aside{width:236px;padding:28px 16px;background:var(--side);color:var(--sideInk);border-right:1px solid var(--line)}
.brand{font-size:24px;font-weight:700;padding:0 14px 4px}aside small{color:var(--sideMut);padding:0 14px 26px}
nav button{color:var(--sideMut);padding:11px 14px;border-radius:12px;margin-bottom:4px;font-weight:500}
nav button:hover{background:var(--sideHov);color:var(--sideInk)}
nav button.on{background:var(--acc);color:#fff;font-weight:600;box-shadow:0 8px 18px -8px #bc1823cc}
.tg{background:none;color:var(--sideMut);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:500}.tg:hover{background:var(--sideHov);color:var(--sideInk)}
main{padding:40px 48px 70px;max-width:1120px}
.card{border:0;border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.stats{gap:16px;margin-bottom:26px}
.stat{border:0;border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.stat::before{content:"";display:block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--acc));margin-bottom:12px}
.stat b{font-weight:700;font-size:30px}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh)}.card:hover{transform:none;box-shadow:var(--sh)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:12px 14px}
td{padding:14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
button.b,a.b{border-radius:999px;padding:10px 22px;box-shadow:0 8px 18px -10px #bc1823}
button.g{box-shadow:none;border-radius:999px}
input,select,textarea{border-radius:12px;padding:11px 14px;background:var(--bg);border:1px solid transparent}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px #bc182322;background:var(--card)}
label{font-weight:500;margin-bottom:5px}
.f{gap:14px;margin-bottom:14px}
.prow{border:0;border-radius:14px;background:var(--bg);padding:16px}
.prow input,.prow select{background:var(--card)}
.ph,.pic{border-radius:12px;background:var(--card)}
.total{font-weight:700}
.ov{backdrop-filter:blur(5px);background:#000a}
.modal{border-radius:22px;padding:28px;box-shadow:0 30px 70px -20px #000a}
.chip{padding:3px 12px}
.pg .card{padding:12px}.pg .big{border-radius:12px}
.warn{border-radius:12px}
.lc{border-radius:22px}
@media(max-width:820px){aside{border-right:0;border-bottom:1px solid var(--line);padding:14px}main{padding:22px 16px 56px}.brand{padding:0 6px 8px}nav button{padding:9px 14px}}
@media print{.modal{box-shadow:none}}
.pic{cursor:default}</style></head><body class="locked">
<aside><div class="brand">Fan<b>Phoria</b></div><small>Pre-Order Management</small>
<nav id="nav"></nav><button class="tg" id="tg" type="button"></button><button class="tg" id="lo" type="button" style="margin-top:8px">⎋ Sign out</button></aside>
<div id="login"><div class="lc"><div class="brand">Fan<b>Phoria</b></div><p>Admin sign in</p><label>Username</label><input id="lu" autocomplete="username"><label style="margin-top:10px">Password</label><input id="lp" type="password" autocomplete="current-password"><div id="le"></div><button class="b" id="li" type="button" style="width:100%;margin-top:10px">Sign in</button></div></div>
<main id="main"></main><div id="modal"></div><div id="toast"></div>
<script>
/* ===== ADMIN LOGINS — edit usernames/passwords here (add more lines for more admins) ===== */
const ADMINS=[{user:"admin",pass:"FanPhoria@2026"}];
/* ===== GOOGLE CONNECTION — paste your Apps Script Web app URL and secret token here ===== */
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbyaZ_SBCxyWAP4YQo7MEJoaQdR8pvlQtyJGrqQ3Dh4WiQ5gZUL-eDMFynnzP8PVL91iXA/exec";
const APPS_SCRIPT_TOKEN="change-this-secret";
const CONNECTED=!APPS_SCRIPT_URL.startsWith("PASTE");
/* ===== SHIPPING CHARGES (৳) — edit the amounts here ===== */
const SHIP={"Inside Dhaka":60,"Outside Dhaka":120,"Self-PickUp":0};
const ST=["New","Confirmed","Ordered","In Transit","Received","Ready for Delivery","Delivered","Cancelled"];
const SC={New:"#d97706",Confirmed:"#2563eb",Ordered:"#7c3aed","In Transit":"#0891b2",Received:"#0d9488","Ready for Delivery":"#c026d3",Delivered:"#1f8a5b",Cancelled:"#6b7280"};
const CATS=["Figure","Plush","Keychain","Clothing","Poster","Accessories","Manga","Other"];
const NAV=[["dash","Dashboard"],["form","New Pre-Order"],["all","All Pre-Orders"],["cust","Customers"],["prod","Products"],["rep","Reports"],["exp","Backup / Export"]];
let db,assets,dl,orders=[],custs=[],view="dash",edit=null,detail=null,armed=0,inv=null,F={q:"",st:"",cat:"",from:"",to:"",cu:""};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tk=n=>"৳"+Number(n||0).toLocaleString("en-US");
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const chip=s=>`<span class="chip" style="--c:${SC[s]||"#666"}">${esc(s)}</span>`;
const cu=o=>custs.find(c=>c.id===o.cid)||{};
const live=o=>o.status!=="Cancelled";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)};
const imgT=()=>"";
const hr=u=>!u?"":/^https?:\/\//i.test(u)?u:"https://"+u.replace(/^[a-z]+:\/*/i,"");
const gd=u=>{const m=/(?:drive|docs)\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]{10,})/)||u.match(/[?&]id=([\w-]{10,})/));return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`:u};
const pimg=p=>p.img?`<img src="${esc(gd(hr(p.img)))}" data-o="${esc(hr(p.img))}" alt="" referrerpolicy="no-referrer">`:"";

/* ---------- Google Sheet adapter ---------- */
const store={orders:{},customers:{}},subs={orders:[],customers:[]};
const emit=c=>{const docs=Object.entries(store[c]).map(([id,d])=>({id,data:()=>d}));subs[c].forEach(f=>f({docs}))};
async function call(d){
  if(!CONNECTED)throw new Error("Google Sheet not connected yet - set APPS_SCRIPT_URL in the code");
  const r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...d,token:APPS_SCRIPT_TOKEN})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Sync failed");return j;
}
async function loadAll(){
  if(!CONNECTED)return;
  try{
    const r=await fetch(APPS_SCRIPT_URL+"?token="+encodeURIComponent(APPS_SCRIPT_TOKEN)),j=await r.json();if(!j.ok)throw new Error(j.error||"load failed");
    const so={},sc={};j.items.forEach(({order,customer})=>{const{id,...o}=order;so[id]=o;if(customer&&order.cid)sc[order.cid]=customer});
    if(JSON.stringify(so)!==JSON.stringify(store.orders)||JSON.stringify(sc)!==JSON.stringify(store.customers)){store.orders=so;store.customers=sc;emit("orders");emit("customers")}
  }catch(e){toast("Could not load from Google Sheet: "+e.message)}
}
function makeDb(){
  return{collection:c=>({onSnapshot:f=>{subs[c].push(f);emit(c)}}),
  doc:p=>{const[c,id]=p.split("/");
    const saveO=async o=>{await call({action:"saveOrder",order:{id,...o},customer:store.customers[o.cid]||{}});store.orders[id]=o;emit("orders")};
    return{
      set:async d=>{if(c==="customers"){store.customers[id]=d;emit("customers")}else await saveO(d)},
      update:async d=>{if(c==="orders")await saveO({...store.orders[id],...d});else{store.customers[id]={...store.customers[id],...d};emit("customers")}},
      delete:async()=>{await call({action:"deleteOrder",id});delete store.orders[id];emit("orders")}};
  }};
}
function makeDl(){return{save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data])),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}}

let TH=null;try{TH=localStorage.getItem("fp-theme")}catch(e){}
const sysT=()=>matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
function applyTh(){const t=TH||sysT();document.documentElement.dataset.theme=t;$("#tg").textContent=t==="dark"?"☀ Light mode":"☾ Dark mode"}
applyTh();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!TH)applyTh()})}catch(e){}
(async()=>{
  db=makeDb();dl=makeDl();
  render(true);if(!db)return;
  const er=e=>toast("Storage error: "+(e.message||e.code));
  db.collection("orders").onSnapshot(s=>{orders=s.docs.map(d=>({...d.data(),id:d.id}));render()},er);
  db.collection("customers").onSnapshot(s=>{custs=s.docs.map(d=>({...d.data(),id:d.id}));render()},er);
  loadAll();setInterval(()=>{if(!document.hidden&&authed()&&!$(".prow"))loadAll()},60000);
})();

function render(force){
  $("#nav").innerHTML=NAV.map(([k,l])=>`<button data-v="${k}" class="${view===k?"on":""}">${l}</button>`).join("");
  if(view==="form"&&!force)return drawModal();
  const V={dash,form:formV,all:allV,cust:custV,prod:prodV,rep:repV,exp:expV}[view];
  $("#main").innerHTML=(CONNECTED?"":`<div class="warn">Google Sheet isn't connected yet. Paste your Apps Script URL into APPS_SCRIPT_URL at the top of the code. Nothing can be saved until then.</div>`)+V();
  if(view==="form")fillForm();
  drawModal();
}
function go(v){view=v;detail=null;inv=null;if(v==="form"&&!edit)edit=null;render(true);scrollTo(0,0)}

/* ---------- Dashboard ---------- */
function dash(){
  const c={};ST.forEach(s=>c[s]=orders.filter(o=>o.status===s).length);
  const open=orders.filter(o=>!["Delivered","Cancelled"].includes(o.status));
  const age=o=>(Date.now()-new Date(o.date+"T00:00"))/864e5;
  const att=[["New orders",c.New],["Not yet ordered from supplier",c.New+c.Confirmed],["Received but not delivered",c.Received+c["Ready for Delivery"]],["Missing product info (photo or price)",open.filter(o=>(o.products||[]).some(p=>!(p.photo||p.img)||!p.price)).length],["Waiting for action more than 7 days",orders.filter(o=>["New","Confirmed"].includes(o.status)&&age(o)>7).length]];
  return `<h1>Dashboard</h1><div class="stats"><button class="stat" data-st=""><b>${orders.length}</b><span>Total pre-orders</span></button>${ST.map(s=>`<button class="stat" style="--c:${SC[s]}" data-st="${s}"><b>${c[s]}</b><span>${s==="New"?"New / pending":s==="Ordered"?"Ordered from supplier":s}</span></button>`).join("")}</div>
  <div class="grid2"><div class="card att"><h2>Attention required</h2>${att.map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b></div>`).join("")}</div>
  <div class="card"><h2>Recent pre-orders</h2>${orders.length?`<div class="wrap">${tbl([...orders].sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,6))}</div>`:`<div class="empty">No pre-orders yet.<br><br><button class="b" data-v="form">Create the first one</button></div>`}</div></div>`;
}
function tbl(list){
  if(!list.length)return `<div class="empty">No pre-orders match.</div>`;
  return `<table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Items</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Due</th><th>Date</th><th>Status</th></tr></thead><tbody>${list.map(o=>{const c=cu(o);return `<tr data-open="${o.id}"><td><b>${o.id}</b></td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${(o.products||[]).length}</td><td class="r">${tk(o.total)}</td><td class="r">${tk(o.paid||0)}</td><td class="r"><b>${tk(o.total-(o.paid||0))}</b></td><td>${fd(o.date)}</td><td>${chip(o.status)}</td></tr>`}).join("")}</tbody></table>`;
}

/* ---------- All orders ---------- */
function filtered(){
  const q=F.q.toLowerCase();
  return orders.filter(o=>{const c=cu(o),ps=o.products||[];
    if(q&&![o.id,o.cid,c.name,c.phone,...ps.flatMap(p=>[p.name,p.anime])].some(x=>(x||"").toLowerCase().includes(q)))return false;
    if(F.st&&o.status!==F.st)return false;if(F.cat&&!ps.some(p=>p.cat===F.cat))return false;
    if(F.from&&o.date<F.from)return false;if(F.to&&o.date>F.to)return false;if(F.cu&&o.cid!==F.cu)return false;return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id.localeCompare(a.id));
}
function allV(){

async function zipPhotos(n){

  if(!items.length)return toast("No photos to download yet");
  toast("Preparing "+items.length+" photos…");
  const z=new JSZip(),ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"};let fail=0;
  await Promise.all(items.map(async({o,p,i})=>{try{const r=await fetch("/_blob/"+p.photo);if(!r.ok)throw 0;const b=await r.blob();z.file(`${o.id}_${(p.name||"product").replace(/[^\w-]+/g,"-").slice(0,40)}_${i+1}.${ext[b.type]||"jpg"}`,b)}catch(e){fail++}}));
  await dl.save({filename:n+".zip",data:await z.generateAsync({type:"uint8array"})});
  if(fail)toast(fail+" photo(s) could not be fetched");

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target,g=s=>t.closest(s);let x;
  if(x=g("[data-v]")){e.preventDefault();if(x.dataset.v==="form")edit=null;go(x.dataset.v)}
  else if(x=g("[data-st]")){F={q:"",st:x.dataset.st,cat:"",from:"",to:"",cu:""};go("all")}
  else if(x=g("[data-cu]")){F={q:"",st:"",cat:"",from:"",to:"",cu:x.dataset.cu};go("all")}
  else if(x=g("[data-open]")){e.preventDefault();detail=x.dataset.open;drawModal()}
  else if(x=g("[data-edit]")){edit=x.dataset.edit;go("form")}
  else if(x=g("[data-cancel]")){setSt(x.dataset.cancel,"Cancelled")}
  else if(x=g("[data-del]")){const id=x.dataset.del;if(armed===id){armed=0;db.doc("orders/"+id).delete().then(()=>{detail=null;toast("Deleted "+id);drawModal()}).catch(er=>toast("Delete failed: "+er.message))}else{armed=id;drawModal();setTimeout(()=>{armed=0;if(detail)drawModal()},4000)}}
  else if(x=g("[data-ex]")){doExport(x.dataset.ex)}
  else if(x=g("[data-inv]")){inv=x.dataset.inv;drawModal();$("#modal").scrollIntoView()}
  else if(g("[data-back]")){inv=null;drawModal()}
  else if(g("[data-print]")){try{window.print()}catch(er){toast("Printing is blocked here. Use Download HTML, then print the file.")}}
  else if(g("[data-dlinv]")){const o=orders.find(y=>y.id===detail);if(!dl)toast("Downloads aren't available in this view");else if(o)dl.save({filename:"INV-"+o.id+".html",data:"<!doctype html><meta charset=utf-8><title>INV-"+o.id+"</title><body style='margin:0;background:#fff'>"+invDoc(o)}).catch(er=>{if(er.code!=="declined")toast("Download failed")})}
  else if(t.dataset.x||g("button[data-x]")){detail=null;inv=null;armed=0;drawModal()}
  else if(t.id==="li")login();
  else if(t.id==="lo")logout();
  else if(t.id==="tg"){TH=document.documentElement.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("fp-theme",TH)}catch(er){}applyTh()}
  else if(t.id==="addp")addRow();
  else if(g(".rm")){const r=g(".prow");if($$(".prow").length>1){r.remove();sum()}else toast("An order needs at least one product")}
  else if(t.id==="sv")save();
  else if(t.id==="fx"){F={q:"",st:"",cat:"",from:"",to:"",cu:""};render(true)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.type==="file")upload(t);
  else if(t.id==="ms")setSt(detail,t.value);
  else if(t.id==="pf"){F.cat=t.value;render(true)}
  else if(t.id==="cid"){const c=custs.find(x=>x.id===t.value.trim());if(c&&!$("#cn").value){$("#cn").value=c.name;$("#cp").value=c.phone;$("#ca").value=c.address||"";$("#cno").value=c.notes||""}}
  else if(t.id==="cs"){const m=t.value.match(/·\s*(\S+)\s*$/),c=m&&custs.find(x=>x.id===m[1]);if(c){$("#cid").value=c.id;$("#cn").value=c.name;$("#cp").value=c.phone;$("#ca").value=c.address||"";$("#cno").value=c.notes||""}}
});
document.addEventListener("input",e=>{
  const t=e.target,map={fq:"q",fs:"st",fc:"cat",fu:"cu",ff:"from",ft:"to"};
  if(t.classList.contains("pp")||t.id==="pd"||t.id==="sz")sum();
  else if(t.classList.contains("pi")){const r=t.closest(".prow");if(!r.dataset.photo)r.querySelector(".pic").innerHTML=(/^https?:\/\/\S+\.\w{2,}/.test(t.value.trim())?pimg({img:t.value.trim()}):"Photo")}
  else if(map[t.id]){F[map[t.id]]=t.value;$("#tb").innerHTML=tbl(filtered())}
});
</script></body></html>
